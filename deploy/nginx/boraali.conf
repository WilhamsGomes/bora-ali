# Nginx do host → contêineres do BoraAli (portas em 127.0.0.1, definidas no .env).
# Instale em /etc/nginx/sites-available/boraali.conf, ative e rode o certbot para o HTTPS:
#   ln -s /etc/nginx/sites-available/boraali.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d boraali.wilhamsdev.com.br -d api-boraali.wilhamsdev.com.br

server {
    listen 80;
    listen [::]:80;
    server_name boraali.wilhamsdev.com.br;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-boraali.wilhamsdev.com.br;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Geração com IA pode levar até ~2 min (AI_TIMEOUT_MS).
        proxy_read_timeout 180s;
    }
}
