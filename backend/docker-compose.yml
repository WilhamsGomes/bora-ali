# Ambiente local: PostgreSQL + API + worker (trabalhos de IA e reconciliação de pagamentos).
# A fila de trabalhos usa o próprio PostgreSQL (SELECT ... FOR UPDATE SKIP LOCKED), sem Redis.
#
#   docker compose up -d postgres           # só o banco, para rodar a API com npm run start:dev
#   docker compose up --build               # tudo em contêineres
name: boraali

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boraali
      POSTGRES_PASSWORD: boraali
      POSTGRES_DB: boraali
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boraali -d boraali"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: boraali-backend:local
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://boraali:boraali@postgres:5432/boraali?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: boraali-backend:local
    command: ["node", "dist/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://boraali:boraali@postgres:5432/boraali?schema=public
      RUN_WORKERS: "false"
      PORT: "3333"
    ports:
      - "3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    image: boraali-backend:local
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://boraali:boraali@postgres:5432/boraali?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
